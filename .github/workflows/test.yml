name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --test --test-reporter=tap "test/*.test.mjs" > /tmp/out.txt 2>&1 || true
          grep -n -B2 -A25 "^not ok\|^    not ok" /tmp/out.txt | head -80 | while IFS= read -r l; do echo "::error::$l"; done
          exit 1
