name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          for i in 1 2 3; do
            node --test --test-reporter=tap "test/*.test.mjs" > /tmp/out$i.txt 2>&1; code=$?
            echo "::error::run $i exit $code fail $(grep -c '^not ok' /tmp/out$i.txt) cancelled $(grep -c 'cancelledByParent' /tmp/out$i.txt) unhandled $(grep -ci 'unhandled\|ECONNREFUSED\|ERR_UNHANDLED' /tmp/out$i.txt)"
            if [ $code != 0 ]; then grep -n -i "unhandled\|ECONNREFUSED\|Error\|not ok" /tmp/out$i.txt | head -15 | while IFS= read -r l; do echo "::error::$l"; done; fi
          done
          exit 1
