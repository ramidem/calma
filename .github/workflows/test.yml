name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          for i in 1 2 3 4 5; do
            npm test > /tmp/out$i.txt 2>&1; code=$?
            echo "::error::npm test run $i exit $code fail $(grep -c '^✖\|^not ok' /tmp/out$i.txt)"
            if [ $code != 0 ]; then grep -n -B3 -A18 '^✖' /tmp/out$i.txt | head -60 | while IFS= read -r l; do echo "::error::$l"; done; fi
          done
          exit 1
